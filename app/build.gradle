plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.mercadototal.cliente'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mercadototal.cliente'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // El repositorio de clientes contiene accidentalmente fuentes de la app personal.
    // Se excluyen explícitamente para impedir que contaminen la compilación del cliente.
    sourceSets {
        main {
            java {
                exclude 'com/mercadototal/personal/**'
            }
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
